name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish released packages
        env:
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        run: |
          set -uo pipefail
          failed=""
          for pkg_path in $(echo "$PATHS_RELEASED" | jq -r '.[]'); do
            echo "Publishing $pkg_path..."
            if pnpm --filter "./$pkg_path" publish --access public --no-git-checks --provenance; then
              echo "✓ Published $pkg_path"
            else
              echo "✗ Failed to publish $pkg_path"
              failed="$failed $pkg_path"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed to publish:$failed"
            exit 1
          fi
