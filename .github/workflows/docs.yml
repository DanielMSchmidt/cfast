name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @cfast/docs exec npx playwright install --with-deps chromium

      - name: Create .dev.vars for step projects
        run: |
          for step_dir in docs/tutorials/team-blog/step-*/; do
            cat > "$step_dir/.dev.vars" <<'VARS'
          MAILGUN_API_KEY=test-key
          MAILGUN_DOMAIN=test.example.com
          VARS
            sed -i 's/^[[:space:]]*//' "$step_dir/.dev.vars"
          done

      - name: Capture tutorial screenshots
        run: pnpm docs:screenshots

      - name: Build docs site
        run: pnpm docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/website/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
