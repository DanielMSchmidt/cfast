name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Typecheck, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: Fetch main branch for turbo comparison
        if: github.event_name == 'pull_request'
        run: git fetch origin main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Build, typecheck, lint & test
        run: >
          pnpm turbo build typecheck lint test
          ${{ github.event_name == 'pull_request' && '--filter=...[origin/main]' || '' }}

      - run: pnpm test

      - name: Build Storybook
        run: pnpm turbo build-storybook --filter=@cfast/ui

      - name: Build docs
        run: pnpm turbo build --filter=@cfast/docs

      - name: Verify docs base path
        run: |
          grep -q '="/cfast/' docs/website/dist/index.html || {
            echo "::error::Docs site is missing the /cfast/ base path. Set base: \"/cfast\" in docs/website/astro.config.mjs"
            exit 1
          }

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm build

      - name: Run integration tests
        run: pnpm --filter integration test

  e2e:
    name: E2E (${{ matrix.example }})
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        example: [team-blog-before, team-blog-after]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter ${{ matrix.example }} exec playwright install --with-deps chromium

      - name: Prepare local D1 database
        run: pnpm --filter ${{ matrix.example }} db:migrate

      - name: Create .dev.vars for Workers secrets
        run: |
          cat > examples/${{ matrix.example }}/.dev.vars <<'VARS'
          MAILGUN_API_KEY=test-key
          MAILGUN_DOMAIN=test.example.com
          VARS
          sed -i 's/^[[:space:]]*//' examples/${{ matrix.example }}/.dev.vars

      - name: Run E2E tests
        run: pnpm --filter ${{ matrix.example }} test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.example }}
          path: examples/${{ matrix.example }}/playwright-report/
          retention-days: 14

  screenshots:
    name: Tutorial Screenshots
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @cfast/docs exec npx playwright install --with-deps chromium

      - name: Create .dev.vars for step projects
        run: |
          for step_dir in docs/tutorials/team-blog/step-*/; do
            cat > "$step_dir/.dev.vars" <<'VARS'
          MAILGUN_API_KEY=test-key
          MAILGUN_DOMAIN=test.example.com
          VARS
            sed -i 's/^[[:space:]]*//' "$step_dir/.dev.vars"
          done

      - name: Capture tutorial screenshots
        run: pnpm docs:screenshots

      - name: Upload tutorial screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-screenshots
          path: docs/website/src/assets/tutorial/*.png
          retention-days: 30
