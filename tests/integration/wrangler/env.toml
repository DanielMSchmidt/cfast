name = "integration-env"
main = "../worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "test-db"
database_id = "test-db-id"

[[kv_namespaces]]
binding = "KV"
id = "test-kv-id"

[[r2_buckets]]
binding = "R2"
bucket_name = "test-r2"

[vars]
ENVIRONMENT = "development"
APP_NAME = "test-app"
